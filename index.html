<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
:root{--red:#b61930;--deep:#690c1b;--text:#192032;--muted:#6e7483;--line:#e7e9ee;--surface:#fff;--bg:#f5f6f8;--soft:#fff0f2;--shadow:0 14px 40px rgba(19,24,40,.055),0 2px 6px rgba(19,24,40,.025);--radius:19px;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.45 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
.wrap{width:min(1212px,100% - 32px);margin-inline:auto}

.hero{background:radial-gradient(90% 150% at 50% -20%,#b4203a 0,transparent 65%),linear-gradient(100deg,#8f0f25,#a0142c 50%,var(--deep));color:#fff;padding-bottom:74px}
.topbar{border-bottom:1px solid rgba(255,255,255,.14)}
.topbar .wrap{display:flex;justify-content:space-between;gap:16px;padding:14px 0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.topbar span:last-child{opacity:.72;text-align:right}
.brand{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding-top:36px}
.brand img{height:106px;width:106px;object-fit:contain}
.brand .right{justify-self:end}
.head{text-align:center}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);border-radius:99px;padding:4px 12px}
h1{font-size:clamp(36px,5.4vw,58px);line-height:1.08;font-weight:900;letter-spacing:-.02em;margin:14px 0 8px}
.sub{margin:0;font-size:15.5px;opacity:.92}

main{margin-top:-58px;padding-bottom:40px}
.panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:20px}
.searchbox{padding:12px 14px}
.search{display:flex;align-items:center;gap:12px;background:#f4f5f7;border:1px solid var(--line);border-radius:13px;padding:0 16px;color:var(--muted);font-size:18px}
.search input{flex:1;min-width:0;border:0;background:none;padding:14px 0;font-size:15.5px;color:var(--text);outline:0}
.search:focus-within{border-color:var(--red)}
.status{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 0;font-size:12px;color:var(--muted)}
.state{display:flex;align-items:center;gap:7px;min-width:0}
.dot{width:7px;height:7px;border-radius:50%;background:#aab;flex:none}
.dot.ok{background:#12a150}.dot.warn{background:#e08a00}.dot.err{background:var(--red)}
.tools{display:flex;align-items:center;gap:10px;flex:none}
.reload{display:grid;place-items:center;width:30px;height:30px;font-size:14px;border:1px solid var(--line);border-radius:9px;background:#fff}
.reload:disabled{opacity:.5;cursor:wait}

.section-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.section-head .ico{width:34px;height:34px;display:grid;place-items:center;background:var(--soft);color:var(--red);border-radius:10px;font-size:17px;flex:none}
.section-head h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0;line-height:1.2}
.section-head p{margin:1px 0 0;color:var(--muted);font-size:13px}
.section-head .end{margin-left:auto;flex:none}
.pill{background:var(--soft);color:var(--deep);font-size:12px;font-weight:700;border-radius:99px;padding:5px 11px}
.textbtn{background:none;border:0;color:var(--red);font-size:13px;font-weight:700;padding:4px}

.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.qcard{position:relative;display:flex;flex-direction:column;background:linear-gradient(145deg,#ffeef1,#fff 72%);border:1px solid #f4dfe3;border-bottom:4px solid var(--red);border-radius:15px;padding:17px;min-height:142px;transition:transform .16s,box-shadow .16s}
.qcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.qcard .ico{width:44px;height:44px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--red);font-size:22px;margin-bottom:16px}
.qcard b{font-size:14.5px;font-weight:800}
.qcard small{color:var(--muted);font-size:12px;margin-top:3px;padding-right:30px}
.qcard .go{position:absolute;right:17px;bottom:17px;color:var(--red);font-size:16px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:600}
.chip em{font-style:normal;color:var(--muted);font-weight:500}
.chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.chip[aria-pressed=true] em{color:#ffd9df}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;align-items:start}
.cat{background:#f8f9fa;border:1px solid var(--line);border-radius:15px;padding:16px}
.cat header{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.cat header .ico{width:36px;height:36px;display:grid;place-items:center;background:var(--soft);color:var(--red);border-radius:10px;font-size:18px;flex:none}
.cat h3{margin:0;font-size:14.5px;font-weight:800}
.cat header p{margin:0;font-size:11.5px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;font-size:13px;font-weight:600;transition:border-color .15s}
.row:hover{border-color:var(--red)}
.row .ico{width:28px;height:28px;display:grid;place-items:center;background:#f2f3f5;border-radius:8px;color:#555c6c;font-size:14px;flex:none}
.row span{flex:1;min-width:0;overflow-wrap:anywhere}
.row .chev{color:#9a9fac;font-size:14px}
.more{display:block;width:100%;background:none;border:0;color:var(--red);font-size:12.5px;font-weight:700;padding:7px}
.empty{text-align:center;color:var(--muted);padding:26px 10px;margin:0}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 28px}

@media (max-width:720px){
  .brand{grid-template-columns:1fr}.brand img{display:none}.topbar span:last-child{display:none}
  .panel{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="hero">
  <div class="topbar"><div class="wrap"><span id="faixaE"></span><span id="faixaD"></span></div></div>
  <div class="wrap brand">
    <div><img id="logoE" alt="" hidden></div>
    <div class="head">
      <span class="tag" id="selo"></span>
      <h1 id="titulo"></h1>
      <p class="sub" id="subtitulo"></p>
    </div>
    <div class="right"><img id="logoD" alt="" hidden></div>
  </div>
</div>

<main class="wrap">
  <section class="panel searchbox">
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="busca" type="search" placeholder="Buscar documento, link ou procedimento" aria-label="Buscar" autocomplete="off">
    </label>
    <div class="status">
      <div class="state" role="status"><i class="dot" id="dot"></i><span id="estado">Carregando…</span></div>
      <div class="tools"><span id="total"></span>
        <button class="reload" id="recarregar" title="Atualizar" aria-label="Atualizar">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
        </button>
      </div>
    </div>
  </section>

  <section class="panel" id="secRapidos" hidden>
    <div class="section-head">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div>
      <div><h2>Acessos rápidos</h2><p>O que você precisa, sem perder tempo.</p></div>
      <div class="end pill" id="qtdRapidos"></div>
    </div>
    <div class="quick" id="rapidos"></div>
  </section>

  <section class="panel">
    <div class="section-head">
      <div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div>
      <div><h2>Explorar por categoria</h2><p>Encontre orientações e sistemas por assunto.</p></div>
      <div class="end"><button class="textbtn" id="verTodas">Ver todas</button></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="cats" id="categorias"></div>
    <p class="empty" id="vazio" hidden></p>
  </section>
</main>
<footer id="rodape"></footer>

<script src="config.js"></script>
<script>
(function () {
  "use strict";
  var C = window.PAINEL_CONFIG || {};
  var LIMITE = C.limitePorCategoria > 0 ? C.limitePorCategoria : 3;
  var CHAVE = "painel-links-v1";
  var OBRIGATORIAS = ["ativo", "titulo", "url"];

  var ICONES = {
    link: '<path d="M10 14a4 4 0 0 0 6 .4l3-3a4 4 0 0 0-5.7-5.6l-1.7 1.7"/><path d="M14 10a4 4 0 0 0-6-.4l-3 3a4 4 0 0 0 5.7 5.6l1.7-1.7"/>',
    pasta: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    caminhao: '<path d="M2 6h12v11H2z"/><path d="M14 10h4l4 4v3h-8z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',
    checklist: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2.5h6V6H9z"/><path d="M9 11h6M9 15h6"/>',
    pessoas: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>',
    calendario: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    caixa: '<path d="m12 3 9 5v8l-9 5-9-5V8z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
    documento: '<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
    mapa: '<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/>',
    grafico: '<path d="M4 4v16h16"/><path d="M8 16v-5M13 16V8M18 16v-9"/>',
    ferramenta: '<path d="M14.5 6a4.5 4.5 0 0 0-5.7 5.7L3 17.5 6.5 21l5.8-5.8A4.5 4.5 0 0 0 18 9.5l-3 3-3.5-3.5z"/>',
    alerta: '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.01"/>'
  };
  var SETA = '<path d="M4 12h16M14 6l6 6-6 6"/>';
  var CHEVRON = '<path d="m9 6 6 6-6 6"/>';

  var $ = function (id) { return document.getElementById(id); };
  var estado = { itens: [], filtro: "", categoria: null, abertas: {}, tudo: false };

  function svg(corpo) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + corpo + "</svg>"; }
  function icone(nome) {
    return svg(Object.prototype.hasOwnProperty.call(ICONES, nome) ? ICONES[nome] : ICONES.link);
  }
  function el(tag, classe, texto) {
    var n = document.createElement(tag);
    if (classe) n.className = classe;
    if (texto != null) n.textContent = texto;
    return n;
  }
  function caixaIcone(classe, nome) {
    var n = el("div", classe);
    n.innerHTML = icone(nome);
    return n;
  }
  function norm(s) {
    return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  }
  function plural(n) { return n + (n === 1 ? " acesso" : " acessos"); }

  // Aceita vírgula ou ponto e vírgula, aspas e quebras de linha dentro de células.
  function lerCSV(texto) {
    texto = texto.replace(/^﻿/, "");
    var primeira = texto.split(/\r?\n/, 1)[0];
    var sep = (primeira.match(/;/g) || []).length > (primeira.match(/,/g) || []).length ? ";" : ",";
    var linhas = [], linha = [], cel = "", aspas = false;
    for (var i = 0; i < texto.length; i++) {
      var c = texto[i];
      if (aspas) {
        if (c === '"' && texto[i + 1] === '"') { cel += '"'; i++; }
        else if (c === '"') aspas = false;
        else cel += c;
      } else if (c === '"') aspas = true;
      else if (c === sep) { linha.push(cel); cel = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && texto[i + 1] === "\n") i++;
        linha.push(cel); linhas.push(linha); linha = []; cel = "";
      } else cel += c;
    }
    if (cel !== "" || linha.length) { linha.push(cel); linhas.push(linha); }
    return linhas;
  }

  function urlSegura(valor) {
    try {
      var u = new URL(String(valor).trim());
      return u.protocol === "https:" || u.protocol === "http:" ? u.href : null;
    } catch (e) { return null; }
  }
  function sim(v) { return ["sim", "s", "x", "true", "verdadeiro", "1"].indexOf(norm(v)) !== -1; }

  function interpretar(texto) {
    var linhas = lerCSV(texto);
    var cab = (linhas.shift() || []).map(norm);
    OBRIGATORIAS.forEach(function (col) {
      if (cab.indexOf(col) === -1) throw new Error("coluna ausente: " + col);
    });
    var res = { itens: [], ignoradas: 0 };
    linhas.forEach(function (l) {
      if (!l.some(function (c) { return c.trim(); })) return;
      var o = {};
      cab.forEach(function (nome, i) { o[nome] = (l[i] || "").trim(); });
      if (!sim(o.ativo)) return;
      var url = urlSegura(o.url);
      if (!url || !o.titulo) { res.ignoradas++; return; }
      res.itens.push({
        titulo: o.titulo, descricao: o.descricao || "", url: url,
        categoria: o.categoria || "Outros", destaque: sim(o.destaque), icone: norm(o.icone) || "link"
      });
    });
    return res;
  }

  function baixar(endereco) {
    var u = new URL(endereco, location.href);
    u.searchParams.set("_", Date.now());
    return fetch(u.href, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    }).then(interpretar);
  }
  function salvar(texto) { try { localStorage.setItem(CHAVE, texto); } catch (e) {} }
  function copiaSalva() {
    try { var s = JSON.parse(localStorage.getItem(CHAVE)); return s && s.itens ? s : null; }
    catch (e) { return null; }
  }
  function aviso(classe, texto) { $("dot").className = "dot " + classe; $("estado").textContent = texto; }

  function carregar() {
    var botao = $("recarregar");
    botao.disabled = true;
    var temPlanilha = !!(C.planilhaCsv && C.planilhaCsv.trim());
    var origem = temPlanilha ? C.planilhaCsv.trim() : "links.csv";

    return baixar(origem).then(function (r) {
      if (temPlanilha) salvar(JSON.stringify(r));
      var msg = temPlanilha ? "Sincronizado com o Google Sheets" : "Lendo o arquivo links.csv";
      if (r.ignoradas) msg += " · " + r.ignoradas + " linha(s) ignorada(s) por falta de título ou link válido";
      aviso(r.ignoradas ? "warn" : "ok", msg);
      aplicar(r.itens);
    }).catch(function (erro) {
      console.warn("Falha ao carregar os links:", erro);
      var copia = copiaSalva();
      if (copia) { aviso("warn", "Planilha indisponível. Mostrando a última cópia salva."); aplicar(copia.itens); return; }
      if (!temPlanilha) { aviso("err", "Não foi possível ler os links."); aplicar([]); return; }
      return baixar("links.csv").then(function (r) {
        aviso("warn", "Planilha indisponível. Mostrando o arquivo links.csv.");
        aplicar(r.itens);
      }).catch(function () { aviso("err", "Não foi possível ler os links."); aplicar([]); });
    }).then(function () { botao.disabled = false; });
  }

  function aplicar(itens) {
    estado.itens = itens;
    if (estado.categoria && !itens.some(function (i) { return i.categoria === estado.categoria; })) estado.categoria = null;
    desenhar();
  }

  function filtrados() {
    var termos = norm(estado.filtro).split(/\s+/).filter(Boolean);
    return estado.itens.filter(function (i) {
      var alvo = norm(i.titulo + " " + i.descricao + " " + i.categoria);
      return termos.every(function (t) { return alvo.indexOf(t) !== -1; });
    });
  }
  function agrupar(itens) {
    var mapa = new Map();
    itens.forEach(function (i) {
      if (!mapa.has(i.categoria)) mapa.set(i.categoria, []);
      mapa.get(i.categoria).push(i);
    });
    return mapa;
  }
  function ancora(classe, item) {
    var a = el("a", classe);
    a.href = item.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    return a;
  }

  function desenhar() {
    var lista = filtrados();
    $("total").textContent = plural(estado.itens.length);
    desenharRapidos(lista);
    desenharChips(lista);
    desenharCategorias(lista);
  }

  function desenharRapidos(lista) {
    var q = lista.filter(function (i) { return i.destaque; });
    var alvo = $("rapidos");
    alvo.replaceChildren();
    $("secRapidos").hidden = !q.length;
    $("qtdRapidos").textContent = plural(q.length);
    q.forEach(function (i) {
      var a = ancora("qcard", i);
      a.appendChild(caixaIcone("ico", i.icone));
      a.appendChild(el("b", "", i.titulo));
      if (i.descricao) a.appendChild(el("small", "", i.descricao));
      var seta = el("span", "go"); seta.innerHTML = svg(SETA);
      a.appendChild(seta);
      alvo.appendChild(a);
    });
  }

  function chip(rotulo, qtd, nomeIcone, cat) {
    var b = el("button", "chip");
    b.type = "button";
    b.setAttribute("aria-pressed", String(estado.categoria === cat));
    if (nomeIcone) b.insertAdjacentHTML("beforeend", icone(nomeIcone));
    b.appendChild(document.createTextNode(rotulo + " "));
    b.appendChild(el("em", "", String(qtd)));
    b.onclick = function () { estado.categoria = cat; desenhar(); };
    return b;
  }

  function desenharChips(lista) {
    var alvo = $("chips");
    alvo.replaceChildren(chip("Todos", lista.length, null, null));
    agrupar(lista).forEach(function (itens, cat) { alvo.appendChild(chip(cat, itens.length, itens[0].icone, cat)); });
  }

  function desenharCategorias(lista) {
    var alvo = $("categorias");
    alvo.replaceChildren();
    var visiveis = lista.filter(function (i) { return !estado.categoria || i.categoria === estado.categoria; });
    var buscando = !!norm(estado.filtro);

    agrupar(visiveis).forEach(function (itens, cat) {
      var aberta = estado.tudo || buscando || estado.categoria === cat || estado.abertas[cat];
      var card = el("article", "cat");
      var h = el("header");
      h.appendChild(caixaIcone("ico", itens[0].icone));
      var t = el("div");
      t.appendChild(el("h3", "", cat));
      t.appendChild(el("p", "", plural(itens.length)));
      h.appendChild(t);
      card.appendChild(h);

      (aberta ? itens : itens.slice(0, LIMITE)).forEach(function (i) {
        var a = ancora("row", i);
        a.appendChild(caixaIcone("ico", i.icone));
        a.appendChild(el("span", "", i.titulo));
        var c = el("i", "chev"); c.innerHTML = svg(CHEVRON);
        a.appendChild(c);
        card.appendChild(a);
      });
      if (itens.length > LIMITE && !buscando && !estado.tudo && estado.categoria !== cat) {
        var mais = el("button", "more", aberta ? "Ver menos" : "Ver todos os " + plural(itens.length));
        mais.type = "button";
        mais.onclick = function () { estado.abertas[cat] = !estado.abertas[cat]; desenhar(); };
        card.appendChild(mais);
      }
      alvo.appendChild(card);
    });

    var vazio = $("vazio");
    vazio.hidden = visiveis.length > 0;
    vazio.textContent = estado.filtro ? "Nada encontrado para essa busca." : "Nenhum acesso publicado no momento.";
    $("verTodas").textContent = estado.tudo ? "Recolher" : "Ver todas";
    $("verTodas").hidden = !visiveis.length;
  }

  function preencher(id, valor) { $(id).textContent = valor || ""; }
  function logo(id, src) { if (src) { $(id).src = src; $(id).hidden = false; } }

  document.title = C.tituloAba || C.titulo || "Portal";
  preencher("faixaE", C.faixaEsquerda);
  preencher("faixaD", C.faixaDireita);
  preencher("selo", C.selo);
  preencher("titulo", C.titulo);
  preencher("subtitulo", C.subtitulo);
  preencher("rodape", C.faixaDireita);
  $("selo").hidden = !C.selo;
  logo("logoE", C.logoEsquerda);
  logo("logoD", C.logoDireita);

  $("busca").addEventListener("input", function (e) { estado.filtro = e.target.value; desenhar(); });
  $("recarregar").addEventListener("click", carregar);
  $("verTodas").addEventListener("click", function () { estado.tudo = !estado.tudo; estado.categoria = null; desenhar(); });
  carregar();
})();
</script>
</body>
