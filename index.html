<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#a32b2e">
<title>Gestão Integrada</title>
<style>
:root{--bar:#a32b2e;--ink:#f3f1ee;--muted:#b9b5b0;--panel:#191716;--line:#34302e;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background:#0b0a0a;color:var(--ink);font:400 16px/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.3)),url(fundo.jpg) center/cover no-repeat}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

.bar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:56px 1fr 56px;align-items:center;min-height:64px;padding-top:env(safe-area-inset-top);background:var(--bar);box-shadow:0 2px 12px rgba(0,0,0,.45)}
.bar h1{margin:0;text-align:center;font-size:clamp(15px,4.7vw,24px);font-weight:700;letter-spacing:.01em;color:#fff}
.burger{width:44px;height:44px;margin-left:8px;display:grid;place-items:center;background:none;border:0;color:#151313;font-size:30px}
.burger svg{stroke-width:2.6}

.filtro{display:flex;justify-content:center;padding:14px 16px 0}
.filtro button{display:inline-flex;align-items:center;gap:8px;background:rgba(20,18,17,.82);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:13px}
.grid{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 10px;width:min(660px,100%);margin:0 auto;padding:clamp(28px,8vw,58px) 12px 40px}
.grid li{min-width:0}
.btn{display:flex;flex-direction:column;align-items:center;gap:13px;color:var(--ink);text-decoration:none;text-align:center;border-radius:14px}
.btn img{display:block;width:min(100%,150px);height:auto;aspect-ratio:1;border-radius:50%;box-shadow:0 8px 18px rgba(0,0,0,.65);transition:transform .14s,filter .14s}
a.btn:hover img{transform:scale(1.04);filter:brightness(1.12)}
a.btn:active img{transform:scale(.95)}
.btn span{font-size:clamp(13px,3.6vw,17px);text-shadow:0 1px 4px #000;overflow-wrap:anywhere}
.btn small{font-size:11px;color:var(--muted);margin-top:-8px}
.off img{filter:grayscale(.75) brightness(.62)}
.off span{color:var(--muted)}
.nada{text-align:center;padding:60px 20px;margin:0;text-shadow:0 1px 4px #000}

.veu{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.55)}
.menu{position:fixed;top:0;left:0;bottom:0;z-index:10;width:min(320px,86vw);display:flex;flex-direction:column;background:var(--panel);box-shadow:6px 0 28px rgba(0,0,0,.6);transform:translateX(-105%);visibility:hidden;transition:transform .2s,visibility .2s;overflow-y:auto}
.menu.on{transform:none;visibility:visible}
.menu header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 14px 14px 18px;background:var(--bar);font-weight:700;color:#fff}
.fechar{width:36px;height:36px;display:grid;place-items:center;background:none;border:0;font-size:22px;color:#fff}
.busca{display:flex;align-items:center;gap:9px;margin:16px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:#232020;color:var(--muted)}
.busca input{flex:1;min-width:0;border:0;background:none;padding:11px 0;color:var(--ink);outline:0;font-size:16px}
.busca:focus-within{border-color:#c9494d}
.cats{display:flex;flex-direction:column;padding:0 8px}
.cats button{display:flex;justify-content:space-between;gap:10px;background:none;border:0;border-radius:9px;padding:12px 10px;text-align:left;font-size:15px}
.cats button em{font-style:normal;color:var(--muted)}
.cats button[aria-pressed=true]{background:#3a1b1d;font-weight:600}
.rodape{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#888;margin-right:6px}
.dot.ok{background:#27b868}.dot.warn{background:#e4962a}.dot.err{background:#e04a4a}
.recarregar{width:34px;height:34px;display:grid;place-items:center;flex:none;background:#232020;border:1px solid var(--line);border-radius:9px;font-size:15px}
.recarregar:disabled{opacity:.5;cursor:wait}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar">
  <button class="burger" id="abrir" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <h1 id="titulo"></h1>
</header>

<div class="filtro" id="filtro" hidden><button type="button" id="limpar"></button></div>
<main>
  <ul class="grid" id="grade"></ul>
  <p class="nada" id="nada" hidden></p>
</main>

<div class="veu" id="veu" hidden></div>
<aside class="menu" id="menu" aria-label="Menu">
  <header><span>Menu</span>
    <button class="fechar" id="fechar" aria-label="Fechar menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </header>
  <label class="busca">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="busca" type="search" placeholder="Buscar" aria-label="Buscar" autocomplete="off">
  </label>
  <div class="cats" id="cats"></div>
  <div class="rodape">
    <div role="status"><i class="dot" id="dot"></i><span id="estado">Carregando…</span></div>
    <button class="recarregar" id="recarregar" aria-label="Atualizar" title="Atualizar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
    </button>
  </div>
</aside>

<script src="config.js"></script>
<script>
(function () {
  "use strict";
  var C = window.PAINEL_CONFIG || {};
  var CHAVE = "painel-links-v2";
  var OBRIGATORIAS = ["ativo", "titulo"];
  var ICONES = ["pasta", "abastecimento", "checklist", "semanal", "dejem", "confirmacao", "pessoas", "calendario", "caixa"];

  var $ = function (id) { return document.getElementById(id); };
  var estado = { itens: [], filtro: "", categoria: null };

  function norm(s) {
    return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  }
  function el(tag, classe, texto) {
    var n = document.createElement(tag);
    if (classe) n.className = classe;
    if (texto != null) n.textContent = texto;
    return n;
  }

  // Aceita vírgula ou ponto e vírgula, aspas e quebras de linha dentro de células.
  function lerCSV(texto) {
    texto = texto.replace(/^﻿/, "");
    var primeira = texto.split(/\r?\n/, 1)[0];
    var sep = (primeira.match(/;/g) || []).length > (primeira.match(/,/g) || []).length ? ";" : ",";
    var linhas = [], linha = [], cel = "", aspas = false;
    for (var i = 0; i < texto.length; i++) {
      var c = texto[i];
      if (aspas) {
        if (c === '"' && texto[i + 1] === '"') { cel += '"'; i++; }
        else if (c === '"') aspas = false;
        else cel += c;
      } else if (c === '"') aspas = true;
      else if (c === sep) { linha.push(cel); cel = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && texto[i + 1] === "\n") i++;
        linha.push(cel); linhas.push(linha); linha = []; cel = "";
      } else cel += c;
    }
    if (cel !== "" || linha.length) { linha.push(cel); linhas.push(linha); }
    return linhas;
  }
  function urlSegura(valor) {
    try {
      var u = new URL(String(valor).trim());
      return u.protocol === "https:" || u.protocol === "http:" ? u.href : null;
    } catch (e) { return null; }
  }
  function sim(v) { return ["sim", "s", "x", "true", "verdadeiro", "1"].indexOf(norm(v)) !== -1; }

  function interpretar(texto) {
    var linhas = lerCSV(texto);
    var cab = (linhas.shift() || []).map(norm);
    OBRIGATORIAS.forEach(function (col) {
      if (cab.indexOf(col) === -1) throw new Error("coluna ausente: " + col);
    });
    var itens = [];
    linhas.forEach(function (l) {
      if (!l.some(function (c) { return c.trim(); })) return;
      var o = {};
      cab.forEach(function (nome, i) { o[nome] = (l[i] || "").trim(); });
      if (!sim(o.ativo) || !o.titulo) return;
      var ic = norm(o.icone);
      itens.push({
        titulo: o.titulo,
        url: urlSegura(o.url),
        categoria: o.categoria || "Outros",
        icone: ICONES.indexOf(ic) !== -1 ? ic : "pasta"
      });
    });
    return itens;
  }

  function baixar(endereco) {
    var u = new URL(endereco, location.href);
    u.searchParams.set("_", Date.now());
    return fetch(u.href, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    }).then(interpretar);
  }
  function salvar(itens) { try { localStorage.setItem(CHAVE, JSON.stringify(itens)); } catch (e) {} }
  function copiaSalva() {
    try { var s = JSON.parse(localStorage.getItem(CHAVE)); return Array.isArray(s) ? s : null; }
    catch (e) { return null; }
  }
  function aviso(classe, texto) { $("dot").className = "dot " + classe; $("estado").textContent = texto; }

  function carregar() {
    $("recarregar").disabled = true;
    var temPlanilha = !!(C.planilhaCsv && C.planilhaCsv.trim());
    return baixar(temPlanilha ? C.planilhaCsv.trim() : "links.csv").then(function (itens) {
      if (temPlanilha) salvar(itens);
      var sem = itens.filter(function (i) { return !i.url; }).length;
      var msg = temPlanilha ? "Sincronizado com a planilha" : "Lendo links.csv";
      aviso(sem ? "warn" : "ok", msg + (sem ? " · " + sem + " sem link" : ""));
      aplicar(itens);
    }).catch(function (erro) {
      console.warn("Falha ao carregar os links:", erro);
      var copia = copiaSalva();
      if (copia) { aviso("warn", "Planilha indisponível. Última cópia salva."); aplicar(copia); return; }
      if (!temPlanilha) { aviso("err", "Não foi possível ler os links."); aplicar([]); return; }
      return baixar("links.csv").then(function (itens) {
        aviso("warn", "Planilha indisponível. Usando links.csv.");
        aplicar(itens);
      }).catch(function () { aviso("err", "Não foi possível ler os links."); aplicar([]); });
    }).then(function () { $("recarregar").disabled = false; });
  }

  function aplicar(itens) {
    estado.itens = itens;
    if (estado.categoria && !itens.some(function (i) { return i.categoria === estado.categoria; })) estado.categoria = null;
    desenhar();
  }
  function porBusca() {
    var termos = norm(estado.filtro).split(/\s+/).filter(Boolean);
    return estado.itens.filter(function (i) {
      var alvo = norm(i.titulo + " " + i.categoria);
      return termos.every(function (t) { return alvo.indexOf(t) !== -1; });
    });
  }

  function botao(item) {
    var b;
    if (item.url) {
      b = el("a", "btn");
      b.href = item.url; b.target = "_blank"; b.rel = "noopener noreferrer";
    } else {
      b = el("div", "btn off");
      b.setAttribute("aria-disabled", "true");
    }
    var img = el("img");
    img.src = "ic-" + item.icone + ".png"; img.alt = ""; img.width = 150; img.height = 150;
    b.appendChild(img);
    b.appendChild(el("span", "", item.titulo));
    if (!item.url) b.appendChild(el("small", "", "sem link"));
    return b;
  }

  function desenhar() {
    var base = porBusca();
    var visiveis = base.filter(function (i) { return !estado.categoria || i.categoria === estado.categoria; });
    var g = $("grade");
    g.replaceChildren();
    visiveis.forEach(function (i) { var li = el("li"); li.appendChild(botao(i)); g.appendChild(li); });
    g.hidden = !visiveis.length;
    $("nada").hidden = visiveis.length > 0;
    $("nada").textContent = estado.filtro ? "Nada encontrado para essa busca." : "Nenhum acesso publicado no momento.";

    var ativos = [estado.categoria, estado.filtro.trim() && "“" + estado.filtro.trim() + "”"].filter(Boolean);
    $("filtro").hidden = !ativos.length;
    $("limpar").textContent = ativos.join(" · ") + "  ✕";

    var cats = new Map();
    base.forEach(function (i) { cats.set(i.categoria, (cats.get(i.categoria) || 0) + 1); });
    var alvo = $("cats");
    alvo.replaceChildren(opcao("Todos", base.length, null));
    cats.forEach(function (n, c) { alvo.appendChild(opcao(c, n, c)); });
  }
  function opcao(rotulo, n, cat) {
    var b = el("button");
    b.type = "button";
    b.setAttribute("aria-pressed", String(estado.categoria === cat));
    b.appendChild(el("span", "", rotulo));
    b.appendChild(el("em", "", String(n)));
    b.onclick = function () { estado.categoria = cat; desenhar(); menu(false); };
    return b;
  }

  function menu(abrir) {
    $("menu").classList.toggle("on", abrir);
    $("veu").hidden = !abrir;
    $("abrir").setAttribute("aria-expanded", String(abrir));
    if (abrir) $("fechar").focus(); else if (document.activeElement && $("menu").contains(document.activeElement)) $("abrir").focus();
  }

  document.title = C.tituloAba || C.titulo || "Portal";
  $("titulo").textContent = C.titulo || "";
  $("abrir").addEventListener("click", function () { menu(true); });
  $("fechar").addEventListener("click", function () { menu(false); });
  $("veu").addEventListener("click", function () { menu(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") menu(false); });
  $("busca").addEventListener("input", function (e) { estado.filtro = e.target.value; desenhar(); });
  $("busca").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); menu(false); } });
  $("limpar").addEventListener("click", function () { estado.filtro = ""; estado.categoria = null; $("busca").value = ""; desenhar(); });
  $("recarregar").addEventListener("click", carregar);
  carregar();
})();
</script>
</body>
</html>
